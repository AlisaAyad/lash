   name: Serverfuncties uitrollen

   on:
     push:
       branches: [main]
       paths: ["supabase/functions/**", ".github/workflows/serverfuncties.yml"]
     workflow_dispatch:

   jobs:
     uitrollen:
       runs-on: ubuntu-latest
       env:
         SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
         PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
       steps:
         - uses: actions/checkout@v4
         - uses: supabase/setup-cli@v1
           with:
             version: latest
         - name: Functies uitrollen
           run: |
             for f in availability book studio calendar-feed reminders; do
               supabase functions deploy "$f" --project-ref "$PROJECT_ID" --no-verify-jwt
             done
